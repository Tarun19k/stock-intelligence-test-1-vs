name: Production health check

# G16 (GAP_REGISTER.md): this workflow already fails loudly in the GHA UI on
# check failure, but that alone is a silent failure mode for a human who isn't
# checking the Actions tab — this repo has no email/Slack secrets configured
# (`gh secret list` confirms only SUPABASE_URL/SUPABASE_SERVICE_KEY exist, as
# of 2026-07-25). Reuses the exact alert-wiring pattern already proven in
# ingest-watchdog.yml (G11): opening a GitHub Issue on failure via
# actions/github-script needs no new secret (GITHUB_TOKEN is automatic) and is
# loud both in the repo and via GitHub's own issue-notification path.

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-accuracy-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check production accuracy page
        id: check
        shell: bash
        run: |
          set -euo pipefail

          response_body="$(mktemp)"
          trap 'rm -f "$response_body"' EXIT

          http_status="$(curl --silent --show-error --location \
            --max-time 30 \
            --output "$response_body" \
            --write-out '%{http_code}' \
            'https://stock-intelligence-test-1-vs.vercel.app/accuracy')"

          echo "HTTP_STATUS=$http_status" >> "$GITHUB_ENV"

          if [[ "$http_status" != '200' ]]; then
            echo "Health check failed: expected HTTP 200, received $http_status" >&2
            exit 1
          fi

          if ! grep --fixed-strings --quiet 'A public record of every call' "$response_body"; then
            echo 'HEALTH_CHECK_REASON=expected accuracy-page content was not found' >> "$GITHUB_ENV"
            echo 'Health check failed: expected accuracy-page content was not found' >&2
            exit 1
          fi

          echo 'Health check passed: accuracy page returned HTTP 200 with expected content'

      # L3-A (2026-07-30): the instrument-detail preview page had zero route-specific
      # monitoring — confirmed live via Vercel runtime logs (1 self-generated request
      # in 7 days). This step gives it a real, enforced check instead of "no complaints".
      - name: Check production instrument page
        id: check_instrument
        shell: bash
        run: |
          set -euo pipefail

          response_body="$(mktemp)"
          trap 'rm -f "$response_body"' EXIT

          http_status="$(curl --silent --show-error --location \
            --max-time 30 \
            --output "$response_body" \
            --write-out '%{http_code}' \
            'https://stock-intelligence-test-1-vs.vercel.app/instrument/RELIANCE')"

          echo "INSTRUMENT_HTTP_STATUS=$http_status" >> "$GITHUB_ENV"

          if [[ "$http_status" != '200' ]]; then
            echo "Health check failed: expected HTTP 200, received $http_status" >&2
            exit 1
          fi

          if ! grep --fixed-strings --quiet 'Signal Risk Parameters' "$response_body"; then
            echo 'INSTRUMENT_CHECK_REASON=expected instrument-page content was not found' >> "$GITHUB_ENV"
            echo 'Health check failed: expected instrument-page content was not found' >&2
            exit 1
          fi

          echo 'Health check passed: instrument page returned HTTP 200 with expected content'

      # SRE council review (2026-07-25), same rationale as ingest-watchdog.yml's
      # G11 fix: no email/Slack channel exists, so open a GitHub Issue instead.
      #
      # BUG FOUND AND FIXED 2026-07-30: this condition originally only checked
      # steps.check.outcome (the /accuracy step) — when the instrument-page step
      # was added, a failure there made the job fail but this step was SKIPPED,
      # because steps.check.outcome was still 'success'. Confirmed via a real,
      # deliberate failure injection (temporarily broke the instrument check's
      # content match, ran it, watched the alert step get skipped) rather than
      # assumed from reading the YAML. Fixed by checking both step outcomes.
      - name: Open an issue if the health check fails
        if: failure() && (steps.check.outcome == 'failure' || steps.check_instrument.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const accuracyFailed = '${{ steps.check.outcome }}' === 'failure';
            const instrumentFailed = '${{ steps.check_instrument.outcome }}' === 'failure';

            const failedChecks = [];
            if (accuracyFailed) {
              failedChecks.push({
                page: '/accuracy',
                httpStatus: process.env.HTTP_STATUS || 'unknown',
                reason: process.env.HEALTH_CHECK_REASON || `unexpected HTTP status ${process.env.HTTP_STATUS || 'unknown'}`,
              });
            }
            if (instrumentFailed) {
              failedChecks.push({
                page: '/instrument/RELIANCE',
                httpStatus: process.env.INSTRUMENT_HTTP_STATUS || 'unknown',
                reason: process.env.INSTRUMENT_CHECK_REASON || `unexpected HTTP status ${process.env.INSTRUMENT_HTTP_STATUS || 'unknown'}`,
              });
            }

            const title = `Production health check failed — ${today}`;
            const body = [
              `The production health check failed on **${today}** for ${failedChecks.length} page(s).`,
              '',
              ...failedChecks.flatMap(c => [
                `**Page:** \`${c.page}\``,
                `**Reason:** ${c.reason}`,
                `**HTTP status observed:** ${c.httpStatus}`,
                '',
              ]),
              `_Opened automatically by [Production health check](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})._`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'health-check',
            });
            if (existing.data.some(i => i.title === title)) {
              console.log('Issue already open for today — not creating a duplicate.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['health-check'],
            });
